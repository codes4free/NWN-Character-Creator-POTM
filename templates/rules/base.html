<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}POTM Character Creator{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1f23;
        --muted: #5b6470;
        --line: #d9ded6;
        --paper: #f8f6f0;
        --panel: #ffffff;
        --accent: #2f6f5e;
        --accent-strong: #214f43;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        border-bottom: 1px solid var(--line);
        padding-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 20px;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        max-width: 720px;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--accent);
        color: var(--accent-strong);
        background: var(--panel);
        text-decoration: none;
        font-weight: 700;
      }

      section {
        margin-top: 32px;
      }

      .counts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .count,
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .count {
        padding: 16px;
        min-height: 96px;
      }

      .count strong {
        display: block;
        font-size: 30px;
        line-height: 1;
        color: var(--accent-strong);
      }

      .count span {
        display: block;
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
      }

      .panel {
        padding: 16px;
        margin-bottom: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        font-size: 13px;
        color: var(--muted);
        text-transform: uppercase;
      }

      td a {
        color: var(--accent-strong);
      }

      .muted {
        color: var(--muted);
      }

      .build-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }

      .sheet-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 20px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }

      .sheet-tabs a {
        color: var(--accent-strong);
        font-weight: 700;
      }

      .sheet-section {
        scroll-margin-top: 16px;
      }

      .sheet-summary-grid,
      .sheet-stat-grid {
        display: grid;
        gap: 16px;
      }

      .sheet-summary-grid {
        grid-template-columns: minmax(240px, 1fr) minmax(320px, 1fr);
      }

      .sheet-stat-grid {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .identity-row {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .identity-row:last-child {
        border-bottom: 0;
      }

      .sheet-form {
        display: grid;
        gap: 16px;
      }

      .form-grid,
      .ability-grid {
        display: grid;
        gap: 14px;
      }

      .form-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .ability-grid {
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }

      .ability-control {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr) 40px;
        gap: 6px;
      }

      .step-button {
        min-height: 40px;
        border: 1px solid var(--accent);
        background: #ffffff;
        color: var(--accent-strong);
        font: inherit;
        font-weight: 700;
      }

      .ability-field small {
        display: block;
        margin-top: 6px;
        color: var(--muted);
      }

      label span {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .field,
      input,
      select,
      textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .point-buy-summary,
      .cost-rules {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .point-buy-summary div,
      .cost-rules span {
        border: 1px solid var(--line);
        background: #ffffff;
        padding: 10px 12px;
      }

      .point-buy-summary strong {
        display: block;
        color: var(--accent-strong);
        font-size: 24px;
        line-height: 1;
      }

      .point-buy-summary span,
      .cost-rules span {
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 1120px);
          padding: 24px 0;
        }

        h1 {
          font-size: 26px;
        }

        .build-header,
        .sheet-summary-grid {
          display: block;
        }

        .build-header .actions {
          margin-top: 16px;
        }

        table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border-bottom: 1px solid var(--line);
        }

        td {
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
